services:
  - type: web
    name: mini-pos
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app --workers 2 --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: FLASK_ENV
        value: production
      - key: FLASK_DEBUG
        value: "0"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: mini-pos-db
          property: connectionString
    healthCheckPath: /
    autoDeploy: true

databases:
  - name: mini-pos-db
    databaseName: mini_pos
    user: mini_pos_user
    plan: free