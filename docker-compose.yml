version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: minipos-db
    environment:
      POSTGRES_DB: minipos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: minipos-app
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/minipos
      - SECRET_KEY=your-secret-key-change-in-production
      - FLASK_ENV=development
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
    command: python run.py

volumes:
  postgres_data: