{% extends "base.html" %}

{% block title %}{{ title }} - Mini POS{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-7">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h3 class="card-title mb-0"><i class="bi bi-cash-stack me-2"></i>{{ title }}</h3>
                    <a href="{{ url_for('dashboard.capital') }}" class="btn btn-outline-secondary">Cancel</a>
                </div>
                <form method="POST" novalidate>
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Type <span class="text-danger">*</span></label>
                            <select name="type" class="form-select" required>
                                <option value="injection">Capital Injection (Add)</option>
                                <option value="withdrawal">Withdrawal (Remove)</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Date <span class="text-danger">*</span></label>
                            <input type="date" name="date" class="form-control" value="{{ today.strftime('%Y-%m-%d') }}" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Amount <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text">Ks</span>
                            <input type="number" name="amount" class="form-control" step="0.01" min="0.01" placeholder="Enter amount" required>
                        </div>
                        <div class="form-text">Enter the capital amount in Kyats</div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Description</label>
                        <input type="text" name="description" class="form-control" placeholder="Optional description (e.g., Owner investment, Bank deposit, Personal withdrawal)">
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-success btn-lg">
                            <i class="bi bi-check-lg me-1"></i>Save
                        </button>
                        <a href="{{ url_for('dashboard.capital') }}" class="btn btn-outline-secondary btn-lg">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
