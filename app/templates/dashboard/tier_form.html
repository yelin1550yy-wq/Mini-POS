{% extends "base.html" %}

{% block title %}{{ title }} - Mo Mo Pajamas For You{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-7">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h3 class="card-title mb-0"><i class="bi bi-award me-2"></i>{{ title }}</h3>
                    <a href="{{ url_for('dashboard.tiers') }}" class="btn btn-outline-secondary">Cancel</a>
                </div>
                <form method="POST" novalidate>
                    <div class="mb-3">
                        <label class="form-label">Tier Name <span class="text-danger">*</span></label>
                        <input type="text" name="tier_name" class="form-control" value="{{ tier.tier_name if tier else '' }}" placeholder="e.g., Silver, Gold, Platinum" required>
                    </div>
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Minimum Spend <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text">Ks</span>
                                <input type="number" name="min_spend" class="form-control" step="0.01" min="0" value="{{ tier.min_spend if tier else 0 }}" required>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Discount % <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <input type="number" name="discount_percent" class="form-control" step="0.01" min="0" max="100" value="{{ tier.discount_percent if tier else 0 }}" required>
                                <span class="input-group-text">%</span>
                            </div>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Description</label>
                        <input type="text" name="description" class="form-control" value="{{ tier.description if tier else '' }}" placeholder="Optional description">
                    </div>
                    <div class="mb-3 form-check form-switch">
                        {% if tier %}
                            {{ form.is_active(class="form-check-input", checked=tier.is_active) }}
                        {% else %}
                            <input class="form-check-input" type="checkbox" name="is_active" id="is_active" checked>
                        {% endif %}
                        <label class="form-check-label" for="is_active">Active</label>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-success btn-lg">
                            <i class="bi bi-check-lg me-1"></i>Save
                        </button>
                        <a href="{{ url_for('dashboard.tiers') }}" class="btn btn-outline-secondary btn-lg">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
